name: Build Mac app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release -- -quiet

      - name: Run audio engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package app
        run: |
          cd build/OpenDesk_artefacts/Release
          ditto -c -k --keepParent OpenDesk.app "$GITHUB_WORKSPACE/OpenDesk-mac.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OpenDesk-mac
          path: OpenDesk-mac.zip
          retention-days: 30
